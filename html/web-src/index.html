<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Warcraft III in your browser" />
    <link rel="icon" href="data:," />
    <title>Warsmash</title>
  </head>
  <body class="engine-page">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
        function handler(event) {
            if (event.code === 'KeyT') {
                event.preventDefault();
                event.stopPropagation();
                window.top.postMessage({ event: 'mp.room.chat' }, '*');
            } else if (event.code === 'KeyP') {
                event.preventDefault();
                event.stopPropagation();
                window.top.postMessage({ event: 'mp.room.chatPrivate' }, '*');
            }
        };
        function mountChatHandlers() {
            document.addEventListener('keydown', handler, { capture: true });
            document.addEventListener('keypress', handler, { capture: true });
        }
        function unmountChatHandlers() {
            document.removeEventListener('keydown', handler, { capture: true });
            document.removeEventListener('keypress', handler, { capture: true });
        }
        window.addEventListener('message', (e) => {
            if (e.data.event === 'mp.room.mountChatHandlers') {
                mountChatHandlers();
            } else if (e.data.event === 'mp.room.unmountChatHandlers') {
                unmountChatHandlers();
            }
        });
        window.top.postMessage({
            event: 'mp.room.ready',
            chatKey: 'T',
            privateChatKey: 'P',
        }, '*');
    </script>
  </body>
</html>
